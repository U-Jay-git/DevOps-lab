<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Event Registration</h1>
    <form action="/submit" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label>Event Name:</label><br>
        <input type="radio" id="codingqueen" name="event" value="CodingQueen">
        <label for="codingqueen">CodingQueen</label><br>
        <input type="radio" id="yogaguru" name="event" value="Yogaguru">
        <label for="yogaguru">Yogaguru</label><br>
        <input type="radio" id="hackathon" name="event" value="Hackathon">
        <label for="hackathon">Hackathon</label><br><br>

        <label for="phone">Phone No:</label>
        <input type="text" id="phone" name="phone" required><br><br>

        <label for="college">College Name:</label>
        <input type="text" id="college" name="college" required><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
